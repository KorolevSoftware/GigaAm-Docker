# Include inside an nginx http{} context; use TLS at the public edge.
server {
    listen 80;
    client_max_body_size 1025m;
    client_body_timeout 1800s;
    location / {
        proxy_pass http://asr:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 5700s;
        send_timeout 300s;
    }
}
